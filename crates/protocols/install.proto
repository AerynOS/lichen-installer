syntax = "proto3";

package lichen.install;

import "google/protobuf/empty.proto";

// Install service: privileged operations for materializing the target system
service Install {
  // Write the system model document into the freshly provisioned target rootfs
  rpc WriteSystemModel(WriteSystemModelRequest) returns (WriteSystemModelResponse) {}

  // Search attached disks for system models left by previous installations
  rpc DiscoverSystemModels(google.protobuf.Empty) returns (DiscoverSystemModelsResponse) {}

  // Install the OS onto the provisioned target and configure it.
  // Requires the target mounts from an applied strategy; runs moss against
  // the target root using the system model written by WriteSystemModel
  rpc InstallSystem(InstallSystemRequest) returns (stream InstallProgress) {}
}

// Request message for WriteSystemModel
message WriteSystemModelRequest {
  // Partion device holding the target root filesystem
  string root_device = 1;

  // Full text of the system-model.kdl document
  string contents = 2;

  // Full text of the install-model.kdl record (installer superset)
  string install_model = 3;
}

// Response message for WriteSystemModel
message WriteSystemModelResponse {
}

// A system model found on an existing filesystem
message DiscoveredModel {
  // Partition device the model was found on
  string device = 1;

  // Full text of the discovered system-model.kdl
  string contents = 2;
}

// Response message for DiscoverySystemModels
message DiscoverSystemModelsResponse {
  repeated DiscoveredModel models = 1;
}

// A filesystem mount for the target installation
message TargetMount {
  // Partition device in /dev
  string device = 1;

  // Mountpoint relative to the target root
  string mountpoint = 2;
}

// A user account to create on the target
message UserSpec {
  string username = 1;
  string real_name = 2;

  // crypt(3) password hash
  string password_hash = 3;
}

// Request message for InstallSystem
message InstallSystemRequest {
  repeated TargetMount mounts = 1;
  string locale = 2;
  string timezone = 3;

  // crypt(3) hash for the root account
  string root_password_hash = 4;

  UserSpec user = 5;
  repeated RepoSpec repositories = 6;
}

// Progress update emitted during installation
message InstallProgress {
  // Progress line, may be empty for keep-alive ticks
  string message = 1;

  // True on the final update of a successful installation
  bool finished = 2;
}

// A package repository to prime into the target before syncing
message RepoSpec {
  // Repository identifier; example: "volatile"
  string id = 1;

  // Direct stone index URI
  string uri = 2;
}
