[workspace]
members = [
    "backend",
    "cli",
    "crates/*"
]
default-members = [
    "backend",
    "cli"
]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.89"
cliclack = { git = "https://github.com/ikeycode/cliclack.git", version = "0.3.5" }
color-eyre = "0.6.5"
console = "0.16.2"
disks = { git = "https://github.com/AerynOS/disks-rs.git", version = "0.1.0" }
inventory = "0.3.21"
locales-rs = { git = "https://github.com/AerynOS/locales-rs.git", version = "0.1.0" }
prost = "0.14.1"
provisioning = { git = "https://github.com/AerynOS/disks-rs.git", version = "0.1.0" }
miette = "7.6.0"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.22"
tokio = "1.46.1"
tokio-stream = "0.1.18"
tonic = "0.14.2"
tonic-build = "0.14.2"
tower = "0.5.2"
hyper-util = "0.1.19"
thiserror = "2.0.17"
os-info = { git = "https://github.com/AerynOS/os-info.git", version = "0.1.0" }
http = "1.4.0"
nix = "0.30.1"
uuid = "1.19.0"


[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
